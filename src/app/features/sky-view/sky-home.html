
  <main class="sky-page">
    @if (skyPage === 'time') {
      <section class="sky-time-layout" [class.panel-collapsed]="!isRightPanelExpanded()">
        <div class="time-column">
          <div class="time-stage">
            <div class="analog-clock-container" aria-label="Local celestial clock">
              <app-analog-clock
                [timezone]="selectedLocation().timezone"
                [activeDate]="activeDate()"
                [showCelestialMarkers]="true"
                [showDigitalReadout]="true">
              </app-analog-clock>
            </div>
          </div>

          <div class="time-controls">
            @if (!isLive()) {
              <button type="button" class="live-return" (click)="setLive()"><i></i> Live</button>
            } @else {
              <span class="live-status"><i></i> Live</span>
            }
            <button type="button" class="time-tool" (click)="jumpToSolarEvent('sunrise')"><span>Sunrise</span><b>{{ formatTime(celestial().solarEvents.sunrise) }}</b></button>
            <button type="button" class="time-tool" (click)="jumpToSolarEvent('noon')"><span>Noon</span><b>{{ formatTime(celestial().solarEvents.solarNoon) }}</b></button>
            <button type="button" class="time-tool" (click)="jumpToSolarEvent('sunset')"><span>Sunset</span><b>{{ formatTime(celestial().solarEvents.sunset) }}</b></button>
            <button type="button" class="time-tool" (click)="jumpToSolarEvent('midnight')"><span>Midnight</span><b>00:00</b></button>
          </div>
