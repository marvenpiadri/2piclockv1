<div class="celestial-logo"
  [class.day]="isDay()"
  [class.transition]="isTransition()"
  [class.night]="!isDay()"
  [attr.aria-label]="isDay() ? '2piClock solar logo' : phaseLabel()"
  [attr.title]="isDay() ? '2piClock · Sun' : phaseLabel()">
  <svg class="celestial-mark" viewBox="0 0 48 48" role="img" aria-hidden="true">
    <defs>
      <radialGradient id="logoSun" cx="35%" cy="30%">
        <stop offset="0%" stop-color="#fff7c2"/><stop offset="45%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
      </radialGradient>
      <radialGradient id="logoMoon" cx="35%" cy="30%">
        <stop offset="0%" stop-color="#ffffff"/><stop offset="65%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#94a3b8"/>
      </radialGradient>
      <filter id="logoGlow"><feGaussianBlur stdDeviation="1.5"/></filter>
      <clipPath id="moonClip"><circle cx="24" cy="24" r="15"/></clipPath>
    </defs>
    <g class="sun-layer" [style.opacity]="celestialOpacity()">
      <circle class="sun-glow" cx="24" cy="24" r="19"/>
      <circle cx="24" cy="24" r="15" fill="url(#logoSun)"/>
      <g class="sun-rays" [style.transform]="'rotate(' + sunRotation() + 'deg)'">
        <path d="M24 3v5M24 40v5M3 24h5M40 24h5M9.2 9.2l3.5 3.5M35.3 35.3l3.5 3.5M38.8 9.2l-3.5 3.5M12.7 35.3l-3.5 3.5"/>
      </g>
    </g>
    <g class="moon-layer" [style.opacity]="moonOpacity()">
      <circle class="moon-glow" cx="24" cy="24" r="18"/>
      <circle cx="24" cy="24" r="15" fill="url(#logoMoon)"/>
      <g clip-path="url(#moonClip)">
        <rect x="9" y="9" width="30" height="30" fill="#334155"/>
        <ellipse cx="24" cy="24" [attr.rx]="moonTerminatorRx()" ry="15" fill="url(#logoMoon)"
          [attr.transform]="'rotate(' + moonTerminatorRotation() + ' 24 24)'"/>
        <circle cx="18" cy="17" r="2" fill="#94a3b8" opacity=".25"/>
        <circle cx="29" cy="29" r="2.5" fill="#94a3b8" opacity=".2"/>
        <circle cx="30" cy="18" r="1.5" fill="#94a3b8" opacity=".25"/>
      </g>
    </g>
    <text x="24" y="27.5" text-anchor="middle" class="logo-type">2π</text>
  </svg>
</div>
