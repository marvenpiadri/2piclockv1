<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X-Facture</title>
    <script>
      // GitHub Pages serves this file for unknown paths. Preserve the
      // Angular route and let the SPA boot normally from the site root.
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var target = '/?x-facture-route=' + encodeURIComponent(path + search + hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
